name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  unit-tests:
    name: unit tests (DAG + skill_lessons)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/cos_test
      LANGCHAIN_TRACING_V2: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: enable pgvector + pg_trgm
        run: |
          PGPASSWORD=ci psql -h localhost -U postgres -d cos_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;"

      - name: apply migrations
        run: |
          PGPASSWORD=ci psql -h localhost -U postgres -d cos_test -v ON_ERROR_STOP=1 \
            -f migrations/postgres_v3.sql \
            -f migrations/postgres_v3_5_b2_skills.sql \
            -f migrations/postgres_v2_0_t6_escalation.sql \
            -f migrations/postgres_v2_0_t6b_persist_runtime_state.sql \
            -f migrations/postgres_v2_0_t7_prompt_versions.sql

      - name: import smoke test (catches missing imports / NameErrors)
        run: python eval/test_imports.py

      - name: runner large-output regression (prevents StreamReader 64KB bug)
        run: python eval/test_runner_large_output.py

      - name: chat retry regression (Databricks 429 / 5xx / conn error)
        run: python eval/test_chat_retry.py

      - name: critical fixes regression (D5 case, D6 unique ws, D7 auth, length caps)
        run: python eval/test_critical_fixes.py

      - name: E5 perf regression (pool + batched log writes)
        env:
          COS_ALLOW_DESTRUCTIVE_TESTS: "1"
        run: python eval/test_e5_perf.py

      - name: F6 checkpoint regression (DAG resume from postgres saver)
        env:
          COS_ALLOW_DESTRUCTIVE_TESTS: "1"
        run: python eval/test_f6_checkpoint.py

      - name: F1 graceful shutdown regression
        run: python eval/test_f1_shutdown.py

      - name: D1 Lite undo regression (snapshot + restore)
        run: python eval/test_d1_undo.py

      - name: v2.0 RAG pipeline regression (T1 rerank + T2 embeddings + R5 fixes)
        run: python eval/test_rag_pipeline.py

      - name: DAG executor parallel/topology tests
        run: python eval/test_dag_parallel.py

      - name: skill_lessons B2/B3 tests
        run: python eval/test_skill_lessons.py

      - name: schema-drift check (TaskState ↔ tasks ↔ upsert ↔ hydration)
        run: python eval/test_schema_drift.py

  promptfoo-gate:
    # T5: per-PR fast prompt-eval gate. Runs the orchestrator + reviewer
    # prompts in isolation against curated cases (no Claude executor).
    # Fails the build if pass-rate drops more than 5 pp from baseline.
    # Skips on PRs from forks because secrets aren't available there.
    name: promptfoo prompt eval (T5)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HOST_NO_SCHEME: ${{ secrets.DATABRICKS_HOST_NO_SCHEME }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install promptfoo
        run: npm install -g promptfoo@latest
      - name: run orchestrator prompt eval
        working-directory: eval/promptfoo
        run: promptfoo eval -c orchestrator.yaml --output run-orchestrator.json --no-write --max-concurrency 2
      - name: run reviewer prompt eval
        working-directory: eval/promptfoo
        run: promptfoo eval -c reviewer.yaml --output run-reviewer.json --no-write --max-concurrency 2
      - name: gate pass-rate against baseline
        run: |
          python eval/promptfoo/check_pass_rate.py \
            --baseline eval/promptfoo/baseline.json \
            --run eval/promptfoo/run-orchestrator.json \
            --run eval/promptfoo/run-reviewer.json \
            --tolerance 5

  fast-eval:
    name: fast eval subset (smoke, manual)
    runs-on: ubuntu-latest
    # Fast eval needs a live Databricks token + Claude Code subprocesses. Don't
    # gate every PR on it — run only when explicitly requested.
    if: contains(github.event.pull_request.labels.*.name, 'run-eval')
    needs: unit-tests
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: cos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s

    env:
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/cos_test
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_BASE_URL: ${{ secrets.DATABRICKS_BASE_URL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: setup db
        run: |
          PGPASSWORD=ci psql -h localhost -U postgres -d cos_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" \
            -c "CREATE EXTENSION IF NOT EXISTS pg_trgm;" \
            -f migrations/postgres_v3.sql \
            -f migrations/postgres_v3_5_b2_skills.sql \
            -f migrations/postgres_v2_0_t6_escalation.sql \
            -f migrations/postgres_v2_0_t6b_persist_runtime_state.sql \
            -f migrations/postgres_v2_0_t7_prompt_versions.sql

      - name: start server
        run: |
          python main.py &
          sleep 8
          curl --fail http://localhost:8000/health

      - name: fast eval subset
        run: python eval/run_eval.py --fast-only --filter writing-launch-blog
